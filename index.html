<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ai là người xui? v2</title>
<style>
:root{--bg:#fff6e0;--dot:#ffe2a3;--panel:#ffffff;--ink:#2a1f4d;--mute:#6f6693;--line:#2a1f4d;--a:#ff4f7b;--b:#ffc933;--c:#2fbf9b;--shadow:#2a1f4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1535;--dot:#2a2150;--panel:#2a2250;--ink:#fff3d6;--mute:#b3a9d9;--line:#fff3d6;--shadow:#0c0820}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(var(--dot) 2px,transparent 2px) 0 0/26px 26px;color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-size:17px;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:clamp(34px,8vw,56px);line-height:1;margin:6px 0 4px;font-weight:800;animation:wob 3s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-2deg)}to{transform:rotate(1.5deg) scale(1.03)}}
.sub{color:var(--mute);margin:0 0 18px}
.box{background:var(--panel);border:3px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--shadow);padding:14px;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:2px 10px 2px 3px;font-weight:700;color:#2a1f4d}
.ph{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;cursor:pointer;overflow:hidden;font-size:15px}
.ph img,.fi{width:100%;height:100%;object-fit:cover;border-radius:50%}
.x{cursor:pointer;opacity:.6}.x:hover{opacity:1}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;padding:8px 12px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:800;border:3px solid var(--line);border-radius:12px;padding:8px 16px;background:var(--c);color:#12302a;cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
button:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
@media (max-width:480px){.tabs{grid-template-columns:repeat(3,1fr)}}
.tab{background:var(--panel);color:var(--ink);padding:8px 4px;font-size:15px;line-height:1.15}
.tab span{display:block;font-size:28px}
.tab.on{background:var(--a);color:#fff;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.05)}}
.opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px;color:var(--mute);font-size:15px}
select{font:inherit;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#stage{min-height:260px;display:flex;flex-direction:column;justify-content:center}
.lane{position:relative;height:42px;border-bottom:2px dashed var(--mute);margin-bottom:4px}
.lane::after{content:"🏁";position:absolute;right:0;top:6px}
.run{position:absolute;top:0;white-space:nowrap;font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px}
.run .f{width:36px;height:36px;font-size:28px;line-height:36px}
.big{display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(32px,9vw,58px);font-weight:800;text-align:center;padding:22px 10px;border:3px solid var(--line);border-radius:16px;background:var(--b);color:#2a1f4d;margin-bottom:12px;min-height:110px}
.big img{height:64px}.big .fi{width:64px}
.ring{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.p{display:flex;align-items:center;gap:5px;border:3px solid var(--line);border-radius:14px;padding:4px 12px;font-weight:700;background:var(--bg);transition:.1s}
.p .fi{width:24px;height:24px}
.p.hot{background:var(--a);color:#fff;transform:scale(1.18) rotate(-3deg)}
.ball{width:80px;height:80px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;overflow:hidden;font-weight:800;text-align:center;font-size:15px;color:#2a1f4d;transition:.4s}
.ball.out{transform:scale(0) rotate(180deg);opacity:0}
.drum{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.drum.spin .ball{animation:jig .25s infinite alternate}
.drum.spin .ball:nth-child(even){animation-delay:.12s}
@keyframes jig{from{translate:-5px 4px}to{translate:5px -5px}}
input[type=number]{font:inherit;width:64px;padding:2px 6px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
/* đĩa bay chọn nhóm */
.arena.auto{height:auto;padding:64px 10px 14px}
.ufo.sm{width:80px;margin-left:0;transition:left .28s ease-in-out,top .28s ease-in-out,opacity .3s}
.ufo.sm .ui{font-size:44px;line-height:44px}.ufo.sm img{height:44px}
.ufo.sm .beam{top:38px;left:0;width:80px;height:46px}
.gg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.gc,.gs{color:#fff;text-align:center;border:2px solid rgba(255,255,255,.55);border-radius:10px;background:rgba(255,255,255,.14);font-weight:800;transition:transform 1s ease-in,opacity 1s ease-in,background .1s}
.gc{padding:4px 0;line-height:1.1}.gc small{display:block;font-size:10px;opacity:.85}.gc b{font-size:19px}
.gt{color:#fff;text-align:center;font-weight:800;margin:14px 0 8px;text-shadow:0 1px 3px #000}
.seats{display:flex;gap:8px;transition:opacity .4s}.seats.off{opacity:.35}
.gs{flex:1;min-width:0;padding:8px 2px;font-size:13px}.gs span{display:block;font-size:26px;line-height:30px}
.gc.hot,.gs.hot{background:var(--a);transform:scale(1.15)}
.gc.out,.gs.out{opacity:.2;transform:scale(.8)}
.ufo.sm.chg{animation:shk .25s infinite}
.gc{cursor:pointer}
.gc.blink,.gs.blink{background:var(--b);color:#2a1f4d;transform:scale(1.22)}
.gc.ex{opacity:.38;border-style:dashed;background:repeating-linear-gradient(45deg,rgba(255,255,255,.1) 0 6px,transparent 6px 12px)}
.gc.dn{opacity:.5;border-color:#2fbf9b}
.arena.tense{box-shadow:inset 0 0 70px 14px rgba(255,79,123,.5)}
.arena{transition:box-shadow 1s}
.gc.abd,.gs.abd{transform:translateY(-70px) scale(.1) rotate(720deg);opacity:0}
/* arena (UFO + black hole) */
.arena{position:relative;height:330px;border:3px solid var(--line);border-radius:16px;overflow:hidden;background:radial-gradient(circle,#fff 0 1px,transparent 2px) 0 0/90px 70px,radial-gradient(circle,#ffe9a8 0 1.5px,transparent 2px) 30px 20px/60px 80px,linear-gradient(#0e0a2e,#3b2a7a);background-size:cover}
.ground{position:absolute;left:0;right:0;bottom:0;height:36px;background:#2fbf9b;border-top:3px solid #12302a}
.av{position:absolute;bottom:32px;width:72px;margin-left:-36px;text-align:center;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;transition:transform 2.3s ease-in,opacity 2.3s ease-in;z-index:1}
.av .f{display:block;height:48px;font-size:40px;line-height:48px;animation:hop .7s infinite alternate ease-out}
.av .fi{width:48px;height:48px;border:2px solid #fff}
@keyframes hop{to{translate:0 -9px}}
.av.abd{transform:translateY(-210px) scale(.1) rotate(900deg);opacity:0}
.ufo{position:absolute;top:12px;left:50%;width:120px;margin-left:-60px;text-align:center;transition:left .8s ease-in-out,top 1.3s ease-in;z-index:3}
.ufo .ui{position:relative;z-index:2;display:block;font-size:64px;line-height:64px;animation:bob 1s infinite alternate ease-in-out}
.ufo img{height:72px}
@keyframes bob{to{translate:0 8px}}
.beam{position:absolute;top:50px;left:10px;width:100px;height:230px;background:linear-gradient(rgba(255,244,130,.9),rgba(255,244,130,.15));clip-path:polygon(32% 0,68% 0,100% 100%,0 100%);opacity:0;transition:opacity .3s}
.hole{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:conic-gradient(#000,#7a3cff,#000,#ff4f7b,#000,#2fbf9b,#000);box-shadow:0 0 40px 12px #7a3cff;animation:spin 1.2s linear infinite}
.hole::after{content:"";position:absolute;inset:14px;border-radius:50%;background:#000}
@keyframes spin{to{rotate:360deg}}
.orb{position:absolute;left:0;top:0;width:70px;margin:-30px 0 0 -35px;text-align:center;color:#fff;font-size:12px;font-weight:800;text-shadow:0 1px 3px #000}
.orb .f{display:block;height:44px;font-size:36px;line-height:44px}.orb .fi{width:44px;height:44px;border:2px solid #fff}
.wheels{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.wb{text-align:center;font-weight:800;flex:1;min-width:150px;max-width:300px}
.wrap{position:relative;padding-top:16px;margin-top:6px}
.wrap canvas{width:100%;height:auto;border-radius:50%;box-shadow:0 0 0 4px var(--line),4px 6px 0 4px var(--shadow);background:#fff}
.ptr{position:absolute;top:0;left:50%;margin-left:-13px;z-index:3;border:13px solid transparent;border-top:28px solid var(--a);border-bottom:0;filter:drop-shadow(0 2px 0 #2a1f4d)}
#go{width:100%;font-size:26px;padding:12px;background:var(--a);color:#fff;margin-top:8px}
#ov{position:fixed;inset:0;background:rgba(20,10,50,.78);display:none;place-items:center;padding:20px;z-index:20}
#ov.show{display:grid}
.card{background:var(--panel);border:4px solid var(--line);border-radius:22px;box-shadow:8px 8px 0 var(--shadow);padding:24px 20px;text-align:center;max-width:420px;width:100%;animation:pop .5s cubic-bezier(.2,1.6,.4,1);position:relative;z-index:2}
.card h2{font-size:clamp(40px,12vw,68px);margin:4px 0;line-height:1;color:var(--a)}
.card p{margin:6px 0 14px}
#em{font-size:56px;height:96px;display:grid;place-items:center}#em img{height:96px;width:96px;border-radius:50%;object-fit:cover;border:4px solid var(--line)}
.pun{background:var(--b);color:#2a1f4d;border-radius:12px;padding:8px 12px;font-weight:700;border:2px dashed #2a1f4d}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}}
.cf{position:fixed;top:-40px;font-size:28px;z-index:1;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
.shake{animation:shk .4s}
@keyframes shk{25%{translate:-8px 4px}50%{translate:8px -4px}75%{translate:-6px -3px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* ===== toàn màn hình ===== */
.fabs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:15;display:flex;gap:8px}
.fabs button{padding:4px 12px;font-size:14px;background:var(--panel);color:var(--ink)}
.fabs button.off{opacity:.55}
@media (max-width:480px){.fabs .lb{display:none}.fabs button{padding:4px 10px;font-size:18px}}
body.grp .sub,body.grp #pbox{display:none}
body.fs h1,body.fs .sub{display:none}
body.fs main{max-width:min(1200px,96vw);padding-top:52px}
body.fs #go{font-size:32px;padding:16px}
/* ===== radar quân sự ===== */
.arena.mil{background:radial-gradient(circle at 50% 35%,#0d3b1c,#04140a 75%);border-color:#2a8f4f;padding:12px 10px 14px}
.arena.mil.tense{box-shadow:inset 0 0 70px 14px rgba(255,60,60,.5)}
.mhud{font:700 13px/1.2 ui-monospace,Consolas,monospace;color:#6dff9c;letter-spacing:.06em;text-align:center;margin-bottom:10px;animation:blk 1.6s steps(2) infinite}
@keyframes blk{50%{opacity:.55}}
.radar{position:relative;width:min(100%,440px);aspect-ratio:1;margin:0 auto;border-radius:50%;border:3px solid #3dff7a;
 background:linear-gradient(90deg,transparent calc(50% - .5px),rgba(80,255,130,.28) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px)),
 linear-gradient(0deg,transparent calc(50% - .5px),rgba(80,255,130,.28) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px)),
 repeating-radial-gradient(circle closest-side,transparent 0 calc(33.33% - 1px),rgba(80,255,130,.3) calc(33.33% - 1px) 33.33%),rgba(3,21,10,.8);
 box-shadow:0 0 30px rgba(60,255,120,.35),inset 0 0 40px rgba(0,0,0,.6)}
body.fs .radar{width:min(100%,max(420px,calc(100vh - 470px)),780px)}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(80,255,130,0) 0 270deg,rgba(80,255,130,.5) 358deg,rgba(170,255,200,.95) 360deg);animation:spin 3s linear infinite;pointer-events:none}
.bl{position:absolute;width:11%;aspect-ratio:1;margin:-5.5% 0 0 -5.5%;border-radius:50%;border:2px solid #5dff8f;background:rgba(60,255,110,.2);color:#d6ffe2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1;cursor:pointer;transition:transform .25s,opacity .6s,background .1s;box-shadow:0 0 8px rgba(60,255,110,.45)}
.bl b{font-size:clamp(11px,3.2vw,17px)}.bl i{font-style:normal;font-size:9px}.bl i:empty{display:none}
.bl.ex{opacity:.4;border-style:dashed;box-shadow:none}.bl.dn{opacity:.5;border-color:#2fbf9b}
.bl.hit,.sd.hit{opacity:.4;border-color:#ff5a5a;background:rgba(255,60,60,.25);box-shadow:none}
.bl.hot,.sd.hot{background:rgba(255,210,60,.9);color:#2a1f00;transform:scale(1.25);z-index:3}
.bl.out,.sd.out{opacity:.15;transform:scale(.7)}
.bl.blink,.sd.blink{background:#ff3b3b;color:#fff;transform:scale(1.4);z-index:3}
.mgt{color:#b7ffcf;font-family:ui-monospace,Consolas,monospace;text-align:center;font-weight:700;margin:12px 0 8px;min-height:2.6em}
.squad{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;transition:opacity .4s}.squad.off{opacity:.35}
.sd{flex:1 1 70px;max-width:130px;text-align:center;border:2px solid rgba(110,255,160,.6);border-radius:10px;background:rgba(80,255,130,.1);color:#d8ffe4;font-weight:800;font-size:13px;padding:8px 2px;transition:transform .25s,opacity .6s,background .1s}
.sd span{display:block;font-size:26px;line-height:30px}
.ret{position:absolute;left:0;top:0;width:60px;height:60px;border:2px solid #ff4f4f;border-radius:50%;pointer-events:none;opacity:0;z-index:6;box-shadow:0 0 14px #f44}
.ret::before,.ret::after{content:"";position:absolute;background:#ff4f4f}
.ret::before{left:50%;top:-10px;bottom:-10px;width:2px;margin-left:-1px}
.ret::after{top:50%;left:-10px;right:-10px;height:2px;margin-top:-1px}
.ret.red{background:rgba(255,60,60,.25);box-shadow:0 0 24px 6px #f44}
.ret.chg{animation:shk .25s infinite}
.msl{position:absolute;font-size:34px;line-height:1;z-index:7;pointer-events:none}
.boom{position:absolute;font-size:30px;z-index:8;pointer-events:none;animation:boom .9s ease-out forwards}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(3.4);opacity:0}}
.mfl{position:absolute;inset:0;background:#fff;z-index:9;pointer-events:none;animation:mfl .45s ease-out forwards}
@keyframes mfl{from{opacity:.75}to{opacity:0}}
/* ===== logo trường ===== */
.brand{display:flex;align-items:center;gap:12px;margin:0 0 4px;padding-right:110px}
.brand svg,.brand img{height:60px;width:auto;aspect-ratio:1806/912;flex:none;object-fit:contain}
.brand b{display:block;font-size:17px;letter-spacing:.04em;line-height:1.15}
.brand small{display:block;color:var(--mute);font:600 12px/1.3 ui-monospace,Consolas,monospace}
body.fs .brand svg,body.fs .brand img{height:88px}
body.fs .brand b{font-size:22px}
#ovlogo svg,#ovlogo img{height:42px;width:auto;aspect-ratio:1806/912;display:block;margin:0 auto 4px;object-fit:contain}
.rlogo{position:absolute;left:50%;top:50%;width:50%;aspect-ratio:1806/912;transform:translate(-50%,-50%);opacity:.11;pointer-events:none}
.rlogo svg,.rlogo img{width:100%;height:auto;display:block}
.msz{display:flex;align-items:center;justify-content:center;gap:10px;color:#b7ffcf;font:700 14px ui-monospace,Consolas,monospace;margin:0 0 10px}
.msz b{font-size:22px;min-width:1.6em;text-align:center;color:#fff}
.szb{width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1;background:rgba(80,255,130,.15);color:#b7ffcf;border:2px solid #3dff7a;box-shadow:none}
.seats{flex-wrap:wrap}.gs{flex:1 1 60px}
.pgrain{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.2}
@media (prefers-color-scheme:dark){.pgrain{opacity:.5}}
.arena{isolation:isolate}
.rain{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.6}
.dec{font-family:ui-monospace,Consolas,Menlo,monospace !important;text-shadow:0 0 14px var(--a)}
</style>
</head>
<body>
<canvas id="bgrain" class="pgrain" aria-hidden="true"></canvas>
<div class="fabs"><button id="rnb" title="Bật/tắt nền mã hóa chạy số" aria-pressed="true">🔐<span class="lb"> Nền mã hóa</span></button><button id="fsb" title="Toàn màn hình">⛶<span class="lb"> Toàn màn hình</span></button></div>
<main>
<div class="brand"><span id="brandLogo"></span><div><b id="brandName"></b><small id="brandSub"></small></div></div>
<h1>Ai là người xui? 🎲</h1>
<p class="sub">Thêm cả nhóm, bấm vào 📷 để gắn ảnh mặt từng người, rồi chọn một trò để chọn người bị dính.</p>

<div class="box" id="pbox">
  <div class="row"><input id="name" type="text" maxlength="14" placeholder="Nhập tên rồi bấm Enter"><button id="add">Thêm</button></div>
  <div class="chips" id="chips"></div>
  <input type="file" id="file" accept="image/*" hidden>
</div>

<div class="tabs" id="tabs"></div>

<div class="box" id="game">
  <div class="opts" id="opts"></div>
  <div id="stage"></div>
  <button id="go">Bắt đầu!</button>
</div>
</main>

<div id="ov"><div class="card"><div id="ovlogo"></div><div id="em">🎯</div><p id="ovt">Người dính là…</p><h2 id="who"></h2><p class="pun" id="pun"></p><button id="again">Chơi lại</button></div></div>

<script>
/* ===== TÙY CHỈNH ẢNH: dán đường dẫn ảnh (hoặc tên file cùng thư mục) vào giữa dấu "" =====
   ufo: ảnh đĩa bay | bomb: ảnh quả bom | bg: ảnh nền bầu trời | ground: (để trống cũng được) */
const ASSETS={ufo:"",bomb:"",bg:"",logo:""};
/* ===== THÔNG TIN TRƯỜNG: sửa ở đây (logo vẽ bằng SVG tự động theo "short"). Có logo thật thì điền vào ASSETS.logo ở trên ===== */
const SCHOOL={short:"ĐHSP TP.HCM",code:"SP",dept:"CNTT",name:"TRƯỜNG ĐẠI HỌC SƯ PHẠM TP. HỒ CHÍ MINH",sub:"// Khoa Công nghệ thông tin"};   /* code & dept (chữ/số không dấu) dùng cho dãy nhị phân và chip trong logo */
/* ===================================================================================== */
const $=s=>document.querySelector(s);
let players=[{n:"Thiết"},{n:"Thanh"},{n:"Hoàng"},{n:"Thịnh"},{n:"Đức"}],mode="ufo",busy=false,raceRule="first",punish=true,upIdx=-1;
const MODES=[["ufo","🛸","Đĩa bay"],["ufog","🛸","Đĩa bay nhóm"],["mil","🎖️","Radar quân sự"],["hole","🕳️","Hố đen"],["race","🏇","Đua thú"],["bomb","💣","Chuyền bom"],["slot","🎰","Máy quay"],["ball","🎱","Loại trừ"],["lq","🎡","Vòng quay LQ"]];
const EMO=["🐎","🐢","🐇","🦆","🐕","🐈","🦊","🐸","🐧","🦄","🐙","🦖"];
const PUN=["Hát một bài trước cả nhóm","Mời cả nhóm ly nước","Kể một bí mật nhỏ","Nhảy 10 giây không nhạc","Nói giọng nũng nịu suốt 5 phút","Chụp một tấm ảnh xấu nhất đăng story","Làm 15 cái hít đất","Đọc to tin nhắn cuối cùng trong điện thoại","Bắt chước một người trong nhóm cho cả bàn đoán","Làm bồi bàn phục vụ cả nhóm 10 phút"];
const col=i=>`hsl(${(i*47+10)%360} 85% 68%)`;
const rnd=n=>Math.floor(Math.random()*n);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ic=(k,e)=>ASSETS[k]?`<img src="${ASSETS[k]}" alt="">`:e;

/* --- Đĩa bay --- */
async function ufo(){
  const n=players.length,w=rnd(n),U=$("#ufo"),B=$("#beam"),at=i=>(i+.5)/n*100+"%";
  await sleep(600);
  const hops=4+rnd(3);
  for(let k=0;k<hops;k++){
    U.style.left=at(rnd(n));beep(250+k*40,.3,"sine");
    await sleep(900);B.style.opacity=.9;beep(180,.4,"sawtooth");
    await sleep(450);B.style.opacity=0;await sleep(150);
  }
  U.style.left=at(w);await sleep(1000);
  B.style.opacity=1;
  for(let k=0;k<8;k++)setTimeout(()=>beep(200+k*90,.3,"sine"),k*250);
  await sleep(500);$("#a"+w).classList.add("abd");
  await sleep(2400);B.style.opacity=0;U.style.top="-120px";U.style.left="115%";
  await sleep(1300);
  return w;
}
/* --- Đĩa bay chọn nhóm: chọn 1 trong G nhóm (có thể khóa nhóm), rồi chọn 1 trong P vị trí --- */
let G=18,P=4,SPD=1.4,NR=true,ex=new Set(),hist=[];
function grp(){return mode==="ufog"||mode==="mil"}
const histHtml=()=>hist.length?`<div class="ring" style="margin-top:12px"><span style="color:var(--mute);align-self:center">Đã bốc:</span>${hist.map(x=>`<span class="p" style="font-size:14px;background:${col(x[0])};color:#2a1f4d">Nhóm ${x[0]+1} · V${x[1]+1}</span>`).join("")}<button id="ghclr" style="padding:2px 10px;font-size:13px;box-shadow:none">↺ Xóa lịch sử</button></div>`:"";
const doneG=()=>new Set(NR?hist.map(h=>h[0]):[]);
const syncEx=()=>{const e=$("#exin");if(e)e.value=[...ex].sort((a,b)=>a-b).map(i=>i+1).join(", ")};
function ufoGStage(){
  const dn=doneG();
  const cells=Array.from({length:G},(_,i)=>{
    const c=ex.has(i)?"ex":dn.has(i)?"dn":"",m=ex.has(i)?"🔒 ":dn.has(i)?"✅ ":"";
    return `<div class="gc ${c}" id="gc${i}"><small>${m}Nhóm</small><b>${i+1}</b></div>`}).join("");
  const h=histHtml();
  return `<div class="arena auto" ${arenaBg()}><canvas class="rain"></canvas><div class="ufo sm" id="gufo" style="left:calc(50% - 40px);top:8px"><div class="beam" id="gbeam"></div><span class="ui">${ic("ufo","🛸")}</span></div>`
  +`<div class="gg">${cells}</div>`

  +`<div class="gt" id="gt">Bấm vào nhóm để khóa 🔒 (không bị chọn) · chọn xong nhóm sẽ quay 1 trong ${P} vị trí</div>`
  +`<div class="seats off">${Array.from({length:P},(_,i)=>`<div class="gs" id="gs${i}"><span>🧑</span>Vị trí ${i+1}</div>`).join("")}</div></div>`+h;
}
$("#stage").addEventListener("click",e=>{
  if(!grp()||busy)return;
  if(e.target.closest("#ghclr")){hist=[];renderStage();return}
  const sz=e.target.closest(".szb");
  if(sz&&milG!==null){                                   /* chỉnh số thành viên của nhóm vừa bị khóa */
    const n=Math.max(2,Math.min(12,milSize(milG)+(+sz.dataset.d)));gsz.set(milG,n);
    $("#szv").textContent=n;$("#squad").innerHTML=milSquad(n);$("#mgt").innerHTML=milMsg();return;
  }

  const i=+c.id.slice(2);
  if(doneG().has(i)&&!ex.has(i))hist=hist.filter(x=>x[0]!==i);   /* bấm vào nhóm ✅ = cho bốc lại */
  else ex.has(i)?ex.delete(i):ex.add(i);                           /* bấm vào nhóm thường = khóa / mở khóa */
  syncEx();renderStage();
});
/* random không thiên lệch (crypto + rejection sampling) */
const rint=n=>{try{const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}catch(e){return rnd(n)}};
const zz=ms=>sleep(ms*SPD);
/* Các giai đoạn:
   1) quét nhanh   2) loại dần ngẫu nhiên, dừng ở một điểm NGẪU NHIÊN (còn 3-5 ô, không chờ đến ô cuối)
   3) kết thúc: tuần tra chậm + tim đập, 0-2 lần "nhử" (nhấp nháy rồi tắt), lần thật nhấp nháy nhanh dần rồi hút luôn */
async function huntCore(avail,label,o){
  let pool=avail.slice(),last=-1;
  const T=Object.assign({fake:"Chưa phải đâu… 😮‍💨",charge:"Nhấp nháy… 🫣"},o.t||{});
  const nb=()=>8+rint(7);                                  /* số lần nhấp nháy: nhử và thật dùng CHUNG phân phối, không lộ */
  o.tense(false);if(o.init)o.init();
  const hover=async(i,d,f)=>{await o.hover(i,d,f);last=i};
  const other=()=>{const a=pool.filter(x=>x!==last);return a.length?a[rint(a.length)]:pool[0]};
  const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rint(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
  const hb=async f=>{beep(f,.12,"sine");await zz(140);beep(f*.9,.15,"sine")};
  /* 1) quét nhanh */
  const big=pool.length>6;
  if(pool.length>1)for(let k=0,sc=big?9+rint(4):3+rint(2);k<sc;k++)await hover(other(),(big?120:220)+k*(big?26:70),300+k*30);
  /* 2) loại dần đến điểm dừng ngẫu nhiên */
  const stopAt=Math.min(pool.length,big?3+rint(3):2+rint(2));
  while(pool.length>stopAt){
    const rm=Math.min(pool.length-stopAt,Math.max(1,Math.round(pool.length*.4)));
    const p=1-pool.length/avail.length,d=240+360*p;
    o.note(label(pool.length));
    for(let k=0,h=2+rint(2);k<h;k++)await hover(other(),d,380+p*300);
    await zz(150);
    for(let k=0;k<rm;k++){
      const x=pool.splice(rint(pool.length),1)[0];
      o.out(x);beep(420-k*40,.18,"triangle");await zz(230);
    }
  }
  /* 3) kết thúc */
  o.tense(true);
  o.note(label(pool.length)+" 😱");
  const win=pool[rint(pool.length)];                       /* người thắng: đều xác suất trong số còn lại */
  const fk=shuf(pool.filter(x=>x!==win)).slice(0,rint(3));  /* 0-2 ô để "nhử" */
  if(pool.length>1){let d=600;for(let k=0,r=2+rint(2);k<r;k++){await hover(other(),d,260+k*20);await hb(80+k*10);d*=1.25}}
  for(const t of fk){
    await hover(t,950,310);
    o.note(T.charge);
    await o.charge(t,nb());
    o.note(T.fake);
    beep(240,.25,"square");setTimeout(()=>beep(150,.4,"square"),250);
    await zz(700);
  }
  await hover(win,950,310);                                /* y hệt lần nhử: cùng tốc độ, cùng âm, cùng thông báo */
  o.note(T.charge);
  await o.charge(win,nb());
  return win;
}
/* bản Đĩa bay */
function gHunt(pre,n,label,avail){
  const U=$("#gufo"),st=$("#stage"),gt=$("#gt"),B=$("#gbeam"),el=i=>$("#"+pre+i),ar=st.querySelector(".arena");
  return huntCore(avail,label,{
    tense:on=>ar.classList.toggle("tense",on),
    note:t=>{gt.textContent=t},
    hover:async(i,d,f)=>{
      st.querySelectorAll(".hot").forEach(e=>e.classList.remove("hot"));
      const c=el(i),t=Math.min(d*.75,650)*SPD;
      U.style.transition=`left ${t}ms ease-in-out,top ${t}ms ease-in-out`;
      U.style.left=c.offsetLeft+c.offsetWidth/2-40+"px";U.style.top=c.offsetTop-44+"px";
      c.classList.add("hot");beep(f,.1,"sine");await zz(d);
    },
    out:i=>{el(i).classList.remove("hot");el(i).classList.add("out")},
    charge:async(i,blinks)=>{           /* nhấp nháy nhanh dần */
      const c=el(i);U.classList.add("chg");let iv=380;
      for(let k=0;k<blinks;k++){
        const on=k%2===0;B.style.opacity=on?.75:0;c.classList.toggle("blink",on);
        beep(180+k*45,.09,"sawtooth");await zz(iv);iv=Math.max(70,iv*.82);
      }
      B.style.opacity=0;c.classList.remove("blink");U.classList.remove("chg");
    }
  });
}
async function abduct(id){
  const el=$("#"+id),B=$("#gbeam");
  $("#stage").querySelectorAll(".hot").forEach(e=>e.classList.remove("hot"));
  B.style.opacity=1;for(let k=0;k<6;k++)setTimeout(()=>beep(200+k*90,.25,"sine"),k*180);
  await sleep(500);el.classList.add("abd");await sleep(1100);B.style.opacity=0;
}
async function gPlay(){
  if(busy)return;
  const dn=doneG(),avail=[...Array(G).keys()].filter(i=>!ex.has(i)&&!dn.has(i));
  if(!avail.length){const t=$("#gt");if(t)t.textContent="Hết nhóm để bốc rồi! Hãy mở khóa nhóm hoặc bấm ↺ Xóa lịch sử.";return}
  busy=true;$("#go").disabled=true;renderStage();
  const U=$("#gufo");
  await sleep(500);
  const g=await gHunt("gc",G,c=>`Còn ${c} nhóm…`,avail);
  await abduct("gc"+g);
  const n=milSize(g);
  $(".seats").innerHTML=Array.from({length:n},(_,i)=>`<div class="gs" id="gs${i}"><span>🧑</span>Vị trí ${i+1}</div>`).join("");
  $("#gt").innerHTML=`🎯 Đã bắt <b>Nhóm ${g+1}</b>! Giờ chọn 1 trong ${n} người…`;
  $(".seats").classList.remove("off");
  await sleep(700);
  const s=await gHunt("gs",n,c=>`Nhóm ${g+1} · còn ${c} vị trí…`,[...Array(n).keys()]);
  await abduct("gs"+s);
  hist.push([g,s]);
  U.style.transition="left 1s ease-in,top 1s ease-in";U.style.top="-120px";U.style.left="115%";
  await sleep(1000);
  $("#em").textContent="🛸";$("#ovt").textContent="Trúng rồi!";
  $("#who").innerHTML=`Nhóm ${g+1}<br><span style="font-size:.62em;color:var(--ink)">Vị trí ${s+1}</span>`;
  $("#pun").style.display="none";
  $("#ov").classList.add("show");confetti();fanfare();decrypt($("#who"),1500);
}

/* --- Radar quân sự: bước 1 chọn NHÓM (radar + tên lửa), bấm tiếp bước 2 mới chọn THÀNH VIÊN --- */
let milG=null;const gsz=new Map();                       /* số thành viên riêng của từng nhóm (mặc định = P) */
function milSize(g){return gsz.has(g)?gsz.get(g):P}
const milSquad=n=>Array.from({length:n},(_,i)=>`<div class="sd" id="sd${i}"><span>🪖</span>Chiến sĩ ${i+1}</div>`).join("");
const milMsg=()=>milG===null?`Bấm “Quét mục tiêu” để radar chọn nhóm `
  :`🎯 MỤC TIÊU ĐÃ BỊ KHÓA: <b>NHÓM ${milG+1}</b><br>Chỉnh số thành viên nếu cần, rồi bấm “Chọn thành viên” (đang chọn trong ${milSize(milG)} người)`;
function milStage(){
  const dn=doneG();
  const bl=Array.from({length:G},(_,i)=>{
    const a=i*2.399963,r=.18+.64*Math.sqrt((i+.5)/G),x=50+50*r*Math.cos(a),y=50+50*r*Math.sin(a);
    const c=milG===i?"hit":ex.has(i)?"ex":dn.has(i)?"dn":"",m=milG===i?"✖":ex.has(i)?"🔒":dn.has(i)?"✅":"";
    return `<div class="bl ${c}" id="bl${i}" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%"><i>${m}</i><b>${i+1}</b></div>`}).join("");
  const n=milG===null?P:milSize(milG);

function initHole(){
  const ar=$("#arena"),W=ar.clientWidth,H=ar.clientHeight,n=players.length,R=Math.min(W,H)/2-38;
  items=players.map((p,i)=>({el:$("#o"+i),a:i/n*Math.PI*2,r:R*(.72+Math.random()*.28),k:.65+Math.random()*.7}));
  items.R=R;items.cx=W/2;items.cy=H/2;drawHole();
}
function drawHole(){const R=items.R;items.forEach(it=>{it.el.style.transform=`translate(${items.cx+Math.cos(it.a)*it.r}px,${items.cy+Math.sin(it.a)*it.r}px) scale(${.35+.65*Math.min(1,it.r/R)})`})}
function hole(){
  return new Promise(res=>{
    initHole();let t=0;
    (function f(){
      t++;
      for(let i=0;i<items.length;i++){
        const it=items[i];
        it.r-=(.12+t*.0007)*it.k;
        it.a+=.025+(items.R/Math.max(it.r,10))*.012;
        if(it.r<14){it.el.style.opacity=0;drawHole();beep(120,.5,"sawtooth");document.querySelector(".arena").classList.add("shake");return res(i)}
      }
      if(t%12===0)beep(90+t/6,.05,"sine");
      drawHole();requestAnimationFrame(f);
    })();
  });
}

function race(){
  return new Promise(res=>{
    const n=players.length,pos=Array(n).fill(0),done=[],w=Math.max(0,$("#stage").clientWidth-130),need=raceRule==="first"?1:n-1;
    let tk=0;
    const t=setInterval(()=>{
      if(tk++%4===0)beep(300+rnd(200),.04);
      for(let i=0;i<n;i++){
        if(pos[i]>=100)continue;
        pos[i]=Math.min(100,pos[i]+Math.random()*2.4);
        if(pos[i]>=100)done.push(i);
        $("#r"+i).style.left=(pos[i]/100*w)+"px";
      }
      if(done.length>=need){clearInterval(t);res(raceRule==="first"?done[0]:[...Array(n).keys()].find(i=>!done.includes(i)))}
    },60);
  });
}

/* chữ kết quả "được giải mã": ký tự hỗn loạn rồi hiện dần từ trái sang phải */
function decrypt(el,ms){
  if(!el)return;
  const nodes=[],w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);while(w.nextNode())nodes.push(w.currentNode);
  const orig=nodes.map(n=>n.nodeValue),total=orig.join("").length,CH="01ABCDEF#$%&<>/{}[]*+=";
  const t0=performance.now();let tick=0;el.classList.add("dec");
  const step=()=>{
    const p=Math.min(1,(performance.now()-t0)/ms),done=Math.floor(p*total);let i=0;
    nodes.forEach((n,k)=>{n.nodeValue=[...orig[k]].map(ch=>{const j=i++;return ch===" "||j<done?ch:CH[(Math.random()*CH.length)|0]}).join("")});
    if(p<1){if(++tick%3===0)beep(500+Math.random()*700,.03,"square");requestAnimationFrame(step)}
    else{nodes.forEach((n,k)=>{n.nodeValue=orig[k]});el.classList.remove("dec")}
  };
  step();
}
</script>
